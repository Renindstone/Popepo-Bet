[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apuestas"
version = "0.1.0"
description = "Análisis de apuestas de fútbol prepartido (ocho ligas europeas y la Champions) con modelos estadísticos, panel web y servidor MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # subida de capturas
    "uvicorn[standard]>=0.30",
    "mcp>=2.3,<3",
    "typer>=0.12",
    "rich>=13",
    "apscheduler>=3.10,<4",
    "pyarrow>=17",
    "duckdb>=1.1",
    "rapidfuzz>=3.9",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
api = ["anthropic>=0.40"]  # motor de capturas con la API de Claude (de pago)

[project.scripts]
apuestas = "apuestas.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
